<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caculator</title>
    <link rel="stylesheet" href="cac.css">
</head>

<body>
    
    <div class="main">
        <div class="night">Night Mode🌙</div>
        <div class="screen">
            <h1>73</h1>
        </div>
        <div class="switch">
            <div>
                <button class="negative">OFF</button>
            </div>
            <div>
                <button class="positive">ON</button>
            </div>
        </div>
        <div class="number">
            <button class="solve">1</button>
            <button class="solve">2</button>
            <button class="solve">3</button>
            <button class="solve">/</button>
            <button class="solve">4</button>
            <button class="solve">5</button>
            <button class="solve">6</button>
            <button class="solve">*</button>
            <button class="solve">7</button>
            <button class="solve">8</button>
            <button class="solve">9</button>
            <button class="solve">-</button>
            <button class="solve">0</button>
            <button class="solve">.</button>
            <button class="solve">=</button>
            <button class="solve">+</button>
        </div>
    </div>
</body>

</html>
